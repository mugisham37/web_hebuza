# Deploys to Railway (project "hebuza", single environment: production). Push to main → production after CI passes;
# "Run workflow" redeploys by hand. Secret (repo settings): RAILWAY_TOKEN_PRODUCTION, a Railway project token scoped to production.
name: deploy
on:
  workflow_run:
    workflows: [web]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy hebuza-web
        run: railway up --ci --service hebuza-web --environment production
