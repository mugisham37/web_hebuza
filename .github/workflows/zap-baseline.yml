# OWASP ZAP baseline (passive) scan against staging. Weekly + on demand; fails on WARN-level alerts not ignored in
# .zap/rules.tsv. Never point it at production with active scanning (this workflow is passive only).
name: zap-baseline
on:
  workflow_dispatch:
    inputs:
      target: { description: "Base URL to scan", required: false, default: "" }
  schedule:
    - cron: "0 3 * * 1"
jobs:
  zap:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a target
        run: test -n "$TARGET" || { echo "Set vars.STAGING_URL or pass target"; exit 1; }
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          fail_action: true
          allow_issue_writing: false
